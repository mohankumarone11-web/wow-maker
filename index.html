<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wow Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0ff;--card:#fff;--ink:#1b1f3b;--mute:#6a6f93;--acc:#ff4f81;--acc2:#12b5a3;--line:#d9dcf5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15172b;--card:#1f2240;--ink:#eef0ff;--mute:#9a9fc8;--line:#32366399}}
:root[data-theme="dark"]{--bg:#15172b;--card:#1f2240;--ink:#eef0ff;--mute:#9a9fc8;--line:#32366399}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Mukta",system-ui,sans-serif;font-size:calc(16px*var(--fs,1))}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:12px 16px;display:flex;align-items:center;gap:10px;z-index:5;border-bottom:1px solid var(--line)}
header b{font-size:1.4rem;font-weight:800;letter-spacing:-.5px}
header i{font-style:normal;background:var(--acc);color:#fff;border-radius:10px 10px 10px 2px;padding:0 8px;margin-right:4px}
main{padding:14px 16px 96px;max-width:720px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-size:.72rem;padding:9px 0;cursor:pointer}
nav button span{display:block;font-size:1.25rem}
nav button.on{color:var(--acc);font-weight:800}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.card{background:var(--card);border-radius:18px;margin-bottom:16px;overflow:hidden}
.th{height:170px;display:flex;align-items:flex-end;padding:12px;color:#fff;font-weight:800;font-size:1.3rem}
.pad{padding:12px 14px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mute{color:var(--mute);font-size:.85rem}
.btn{border:0;border-radius:999px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--line);color:var(--ink)}
.btn.p{background:var(--acc);color:#fff}
.btn.t{background:var(--acc2);color:#fff}
.score{margin-left:auto;font-weight:800;color:var(--acc2)}
h2{margin:4px 0 12px;font-size:1.3rem}
label{display:block;font-weight:600;margin:12px 0 4px}
input[type=text],textarea{width:100%;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px;font:inherit}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden}.bar div{height:100%;background:var(--acc2)}
.ok{color:var(--acc2)}.bad{color:var(--acc)}
.shorts{height:56vh;min-height:360px;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;color:#fff;border-radius:22px;font-size:1.5rem;font-weight:800}
.sw{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
@media(prefers-reduced-motion:no-preference){.btn{transition:transform .12s}.btn:active{transform:scale(.94)}}
</style>
</head>
<body>
<header><b><i>Wow</i>Maker</b></header>
<main id="m"></main>
<nav id="n"></nav>
<script>
var G=["linear-gradient(135deg,#ff4f81,#ffb15c)","linear-gradient(135deg,#12b5a3,#3b5bdb)","linear-gradient(135deg,#7048e8,#ff4f81)","linear-gradient(135deg,#f59f00,#12b5a3)"];
var D={videos:[{t:"1v4 clutch in Free Fire, full game",c:"Gamer Zone",v:1240,w:88,g:0},{t:"Learn mobile editing in 10 minutes",c:"Edit Guru",v:860,w:74,g:1},{t:"Easy tasty chaat at home",c:"Desi Kitchen",v:2100,w:81,g:2},{t:"Village morning, a video without talking",c:"Quiet Corner",v:430,w:92,g:3}],wow:{},joined:{},streak:{},sh:0,set:{theme:"auto",fs:1,n1:true,n2:true},m:{watch:62,rep:35,com:48}};
var S=D;try{var x=localStorage.getItem("wm2");if(x)S=JSON.parse(x)}catch(e){}
function save(){try{localStorage.setItem("wm2",JSON.stringify(S))}catch(e){}}
function sc(m){return Math.round(m.watch*.5+m.rep*.3+m.com*.2)}
function lvl(d){return d>=30?"Special":d>=7?"Regular":"New"}
function theme(){var r=document.documentElement;S.set.theme=="auto"?r.removeAttribute("data-theme"):r.setAttribute("data-theme",S.set.theme);r.style.setProperty("--fs",S.set.fs)}
var T=[["home","🏠","Home"],["shorts","⚡","Shorts"],["studio","🎬","Studio"],["circle","🫂","Circle"],["stats","📊","Analytics"],["set","⚙️","Settings"]];
var V={
home:function(){return S.videos.map(function(v,i){return '<div class="card"><div class="th" style="background:'+G[v.g%4]+'">'+v.t+'</div><div class="pad"><b>'+v.t+'</b><div class="row mute">'+v.c+' · '+(v.v+(S.wow[i]?1:0))+' views<button class="btn '+(S.wow[i]?'p':'')+'" data-w="'+i+'">'+(S.wow[i]?'Wowed':'Wow')+'</button><span class="score">Wow Score '+v.w+'</span></div></div></div>'}).join("")},
shorts:function(){var i=S.sh%S.videos.length,v=S.videos[i];return '<div class="shorts" style="background:'+G[v.g%4]+'">'+v.t+'<div class="mute" style="color:#fff">'+v.c+'</div><div class="row" style="margin-top:12px"><button class="btn" data-w="'+i+'">'+(S.wow[i]?'Wowed':'Wow')+'</button><button class="btn p" id="nx">Next short</button></div></div>'},
studio:function(){return '<h2>New video</h2><label>Video file</label><input type="file" accept="video/*" id="f"><label>Title <span class="mute" id="tc">0/70</span></label><input type="text" id="ti" maxlength="70"><label>Title B (for testing, optional)</label><input type="text" id="tb" maxlength="70"><label>Description</label><textarea id="ds" rows="3"></textarea><label>Tags (separate with commas)</label><input type="text" id="tg"><label>Thumbnail color</label><div class="row">'+G.map(function(g,i){return '<button class="btn" data-g="'+i+'" style="background:'+g+';width:54px;height:36px" aria-label="Color '+(i+1)+'"></button>'}).join("")+'</div><div class="card pad" style="margin-top:14px" id="ck"></div><button class="btn p" id="pub">Publish</button>'},
circle:function(){return '<h2>Circle</h2><p class="mute">Instead of subscribing, you join a channel\'s Circle. The more days you watch, the higher your level: New, Regular (7 days), Special (30 days).</p>'+S.videos.map(function(v,i){var d=S.streak[i]||0,j=S.joined[i];return '<div class="card pad"><b>'+v.c+'</b><div class="mute">'+(j?'Level: '+lvl(d)+' · watched '+d+' days':'Not joined yet')+'</div><div class="row" style="margin-top:8px"><button class="btn '+(j?'':'p')+'" data-j="'+i+'">'+(j?'Leave Circle':'Join Circle')+'</button>'+(j?'<button class="btn t" data-s="'+i+'">Watched today</button>':'')+'</div></div>'}).join("")},
stats:function(){var m=S.m,q=sc(m);function r(k,l){return '<label>'+l+': '+m[k]+'%</label><input type="range" min="0" max="100" value="'+m[k]+'" data-m="'+k+'" style="width:100%">'}return '<h2>Wow Score</h2><div class="card pad"><div style="font-size:3rem;font-weight:800;color:var(--acc2)">'+q+'</div><div class="bar"><div style="width:'+q+'%"></div></div><p class="mute">Score = full watch rate 50% + returning viewers 30% + real comments 20%. Change the numbers below to try it (demo).</p>'+r("watch","Full watch rate")+r("rep","Returning viewers")+r("com","Real comments")+'</div><div class="card pad"><b>Earning milestones</b>'+[["Start",40],["Growing",60],["Earnings unlocked",75]].map(function(p){return '<div class="row" style="margin-top:8px"><span class="'+(q>=p[1]?'ok':'mute')+'">'+(q>=p[1]?'✔ ':'○ ')+p[0]+' (score '+p[1]+'+)</span></div>'}).join("")+'<p class="mute">A milestone unlocks when the score stays above it for 28 days. Real earnings will need ads or sponsors, added later.</p></div>'},
set:function(){function sw(k,l){return '<div class="sw"><span>'+l+'</span><input type="checkbox" data-k="'+k+'" '+(S.set[k]?'checked':'')+' style="width:22px;height:22px"></div>'}return '<h2>Settings</h2><div class="card pad"><div class="sw"><span>Theme</span><span>'+["auto","light","dark"].map(function(t){return '<button class="btn '+(S.set.theme==t?'p':'')+'" data-th="'+t+'">'+{auto:"Auto",light:"Light",dark:"Dark"}[t]+'</button> '}).join("")+'</span></div><div class="sw"><span>Text size</span><span><button class="btn" data-f="-.1">A-</button> <button class="btn" data-f=".1">A+</button></span></div>'+sw("n1","New video notifications")+sw("n2","Comment notifications")+'<div class="sw"><span>Language</span><span class="mute">English</span></div><div class="sw"><span>Data</span><button class="btn" id="rs">Reset</button></div></div>'}};
var cur="home",gi=0;
function chk(){var t=document.getElementById("ti").value,tg=document.getElementById("tg").value.split(",").filter(function(s){return s.trim()}),o=[];o.push([t.length>=10,"Title is at least 10 characters"]);o.push([!/(.)\1{3,}/.test(t)&&!/[!?]{3,}/.test(t),"No repeated letters or !!! spam"]);o.push([t==""||t!=t.toUpperCase()||/[^A-Za-z]/.test(t),"Title is not all capital letters"]);o.push([tg.length<=15,"No more than 15 tags ("+tg.length+")"]);o.push([true,"Tags match the video, no fake tags"]);document.getElementById("tc").textContent=t.length+"/70";document.getElementById("ck").innerHTML="<b>Spam check</b>"+o.map(function(a){return '<div class="'+(a[0]?'ok':'bad')+'">'+(a[0]?'✔ ':'✖ ')+a[1]+'</div>'}).join("");return o.slice(0,4).every(function(a){return a[0]})}
function show(t){cur=t;document.getElementById("m").innerHTML=V[t]();document.getElementById("n").innerHTML=T.map(function(a){return '<button class="'+(a[0]==t?'on':'')+'" data-t="'+a[0]+'"><span>'+a[1]+'</span>'+a[2]+'</button>'}).join("");if(t=="studio"){chk();document.getElementById("ti").oninput=chk;document.getElementById("tg").oninput=chk}history.replaceState(null,"","#"+t)}
document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var d=b.dataset;if(d.t)return show(d.t);if(d.w!==undefined)S.wow[d.w]=!S.wow[d.w];else if(d.j!==undefined)S.joined[d.j]=!S.joined[d.j];else if(d.s!==undefined)S.streak[d.s]=(S.streak[d.s]||0)+1;else if(d.g!==undefined)gi=+d.g;else if(d.th){S.set.theme=d.th;theme()}else if(d.f){S.set.fs=Math.min(1.4,Math.max(.8,S.set.fs+ +d.f));theme()}else if(b.id=="nx")S.sh++;else if(b.id=="rs"){S=JSON.parse(JSON.stringify(D));theme()}else if(b.id=="pub"){if(!chk())return alert("Fix the red items in the spam check first");var t=document.getElementById("ti").value,tb=document.getElementById("tb").value;S.videos.unshift({t:t,c:"My channel",v:0,w:50,g:gi,tb:tb});save();return show("home")}else return;save();show(cur)});
document.addEventListener("change",function(e){var k=e.target.dataset.k;if(k){S.set[k]=e.target.checked;save()}});
document.addEventListener("input",function(e){var k=e.target.dataset.m;if(k){S.m[k]=+e.target.value;save();var y=window.scrollY;show("stats");window.scrollTo(0,y)}});
theme();var h=location.hash.slice(1);show(V[h]?h:"home");
</script>
</body>
</html>
