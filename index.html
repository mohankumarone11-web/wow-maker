<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wow Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0ff;--card:#fff;--ink:#1b1f3b;--mute:#6a6f93;--acc:#ff4f81;--acc2:#12b5a3;--line:#d9dcf5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15172b;--card:#1f2240;--ink:#eef0ff;--mute:#9a9fc8;--line:#32366399}}
:root[data-theme="dark"]{--bg:#15172b;--card:#1f2240;--ink:#eef0ff;--mute:#9a9fc8;--line:#32366399}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Mukta",system-ui,sans-serif;font-size:calc(16px*var(--fs,1))}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:12px 16px;display:flex;align-items:center;gap:10px;z-index:5;border-bottom:1px solid var(--line)}
header b{font-size:1.4rem;font-weight:800;letter-spacing:-.5px}
header i{font-style:normal;background:var(--acc);color:#fff;border-radius:10px 10px 10px 2px;padding:0 8px;margin-right:4px}
main{padding:14px 16px 96px;max-width:720px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-size:.62rem;padding:9px 0;cursor:pointer}
nav button span{display:block;font-size:1.15rem}
nav button.on{color:var(--acc);font-weight:800}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.card{background:var(--card);border-radius:18px;margin-bottom:16px;overflow:hidden}
.th{height:170px;display:flex;align-items:flex-end;padding:12px;color:#fff;font-weight:800;font-size:1.3rem}
.pad{padding:12px 14px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mute{color:var(--mute);font-size:.85rem}
.btn{border:0;border-radius:999px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--line);color:var(--ink)}
.btn.p{background:var(--acc);color:#fff}
.btn.t{background:var(--acc2);color:#fff}
h2{margin:4px 0 12px;font-size:1.3rem}
label{display:block;font-weight:600;margin:12px 0 4px}
input[type=text],input[type=email],input[type=password],textarea{width:100%;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px;font:inherit}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden}.bar div{height:100%;background:var(--acc2)}
.ok{color:var(--acc2)}.bad{color:var(--acc)}
.shorts{height:56vh;min-height:360px;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;color:#fff;border-radius:22px;font-size:1.5rem;font-weight:800}
.sw{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
@media(prefers-reduced-motion:no-preference){.btn{transition:transform .12s}.btn:active{transform:scale(.94)}}
</style>
</head>
<body>
<header><b><i>Wow</i>Maker</b></header>
<main id="m"></main>
<nav id="n"></nav>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,updateProfile} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,deleteDoc,getDocs,addDoc,query,where,orderBy,limit,serverTimestamp,getCountFromServer} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyCBFwrY8en0XqEfPieeEBU6zEzhOityEIQ",authDomain:"wow-maker.firebaseapp.com",projectId:"wow-maker",storageBucket:"wow-maker.firebasestorage.app",messagingSenderId:"773931035933",appId:"1:773931035933:web:14258b97741bd1af9ec5f4"});
const auth=getAuth(app),db=getFirestore(app);
const G=["linear-gradient(135deg,#ff4f81,#ffb15c)","linear-gradient(135deg,#12b5a3,#3b5bdb)","linear-gradient(135deg,#7048e8,#ff4f81)","linear-gradient(135deg,#f59f00,#12b5a3)"];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
const today=()=>new Date().toISOString().slice(0,10);
let S={user:null,videos:[],wc:{},mine:new Set(),circ:{},tab:"home",sh:0,msg:"",busy:true,gi:0,set:{theme:"auto",fs:1,n1:true,n2:true},m:{watch:62,rep:35,com:48}};
try{Object.assign(S.set,JSON.parse(localStorage.getItem("wm3")||"{}"))}catch(e){}
const saveSet=()=>{try{localStorage.setItem("wm3",JSON.stringify(S.set))}catch(e){}};
const sc=m=>Math.round(m.watch*.5+m.rep*.3+m.com*.2);
const lvl=d=>d>=30?"Special":d>=7?"Regular":"New";
function theme(){const r=document.documentElement;S.set.theme=="auto"?r.removeAttribute("data-theme"):r.setAttribute("data-theme",S.set.theme);r.style.setProperty("--fs",S.set.fs)}
const T=[["home","🏠","Home"],["shorts","⚡","Shorts"],["studio","🎬","Studio"],["circle","🫂","Circle"],["stats","📊","Stats"],["set","⚙️","Settings"],["acct","👤","Account"]];
async function load(){
S.busy=true;show();
try{
const vs=await getDocs(query(collection(db,"videos"),orderBy("createdAt","desc"),limit(30)));
S.videos=vs.docs.map(d=>({id:d.id,...d.data()}));
await Promise.all(S.videos.map(async v=>{const c=await getCountFromServer(query(collection(db,"wows"),where("videoId","==",v.id)));S.wc[v.id]=c.data().count}));
S.mine=new Set();S.circ={};
if(S.user){
const w=await getDocs(query(collection(db,"wows"),where("uid","==",S.user.uid)));w.forEach(d=>S.mine.add(d.data().videoId));
const c=await getDocs(query(collection(db,"circles"),where("uid","==",S.user.uid)));c.forEach(d=>{S.circ[d.data().ownerId]=d.data()});
}
}catch(e){S.msg="Could not load: "+e.message}
S.busy=false;show();
}
const empty='<p class="mute">No videos yet. Log in, then publish the first one in Studio.</p>';
const V={
home:()=>S.videos.length?S.videos.map(v=>'<div class="card"><div class="th" style="background:'+G[(v.g||0)%4]+'">'+esc(v.t)+'</div><div class="pad"><b>'+esc(v.t)+'</b><div class="row mute">'+esc(v.ownerName)+' · '+(S.wc[v.id]||0)+' wows<button class="btn '+(S.mine.has(v.id)?'p':'')+'" data-w="'+esc(v.id)+'">'+(S.mine.has(v.id)?'Wowed':'Wow')+'</button></div></div></div>').join(""):empty,
shorts:()=>{if(!S.videos.length)return empty;const v=S.videos[S.sh%S.videos.length];return '<div class="shorts" style="background:'+G[(v.g||0)%4]+'">'+esc(v.t)+'<div class="mute" style="color:#fff">'+esc(v.ownerName)+'</div><div class="row" style="margin-top:12px"><button class="btn" data-w="'+esc(v.id)+'">'+(S.mine.has(v.id)?'Wowed':'Wow')+'</button><button class="btn p" id="nx">Next short</button></div></div>'},
studio:()=>!S.user?'<h2>Studio</h2><p class="mute">Log in first (Account tab) to publish videos.</p>':'<h2>New video</h2><label>Video file (not uploaded yet)</label><input type="file" accept="video/*" id="f"><label>Title <span class="mute" id="tc">0/70</span></label><input type="text" id="ti" maxlength="70"><label>Title B (for testing, optional)</label><input type="text" id="tb" maxlength="70"><label>Description</label><textarea id="ds" rows="3"></textarea><label>Tags (separate with commas)</label><input type="text" id="tg"><label>Thumbnail color</label><div class="row">'+G.map((g,i)=>'<button class="btn" data-g="'+i+'" style="background:'+g+';width:54px;height:36px" aria-label="Color '+(i+1)+'"></button>').join("")+'</div><div class="card pad" style="margin-top:14px" id="ck"></div><button class="btn p" id="pub">Publish</button><p class="mute">'+esc(S.msg)+'</p>',
circle:()=>{const o={};S.videos.forEach(v=>{o[v.ownerId]=v.ownerName});const ids=Object.keys(o);return '<h2>Circle</h2><p class="mute">Instead of subscribing, you join a channel\'s Circle. The more days you watch, the higher your level: New, Regular (7 days), Special (30 days).</p>'+(!S.user?'<p class="mute">Log in to join a Circle.</p>':'')+(ids.length?ids.map(k=>{const c=S.circ[k],d=c?c.days:0;return '<div class="card pad"><b>'+esc(o[k])+'</b><div class="mute">'+(c?'Level: '+lvl(d)+' · watched '+d+' days':'Not joined yet')+'</div><div class="row" style="margin-top:8px"><button class="btn '+(c?'':'p')+'" data-j="'+esc(k)+'">'+(c?'Leave Circle':'Join Circle')+'</button>'+(c?'<button class="btn t" data-s="'+esc(k)+'">Watched today</button>':'')+'</div></div>'}).join(""):empty)},
stats:()=>{const m=S.m,q=sc(m);const r=(k,l)=>'<label>'+l+': '+m[k]+'%</label><input type="range" min="0" max="100" value="'+m[k]+'" data-m="'+k+'" style="width:100%">';return '<h2>Wow Score</h2><div class="card pad"><div style="font-size:3rem;font-weight:800;color:var(--acc2)">'+q+'</div><div class="bar"><div style="width:'+q+'%"></div></div><p class="mute">Score = full watch rate 50% + returning viewers 30% + real comments 20%. Numbers below are a demo.</p>'+r("watch","Full watch rate")+r("rep","Returning viewers")+r("com","Real comments")+'</div><div class="card pad"><b>Earning milestones</b>'+[["Start",40],["Growing",60],["Earnings unlocked",75]].map(p=>'<div class="row" style="margin-top:8px"><span class="'+(q>=p[1]?'ok':'mute')+'">'+(q>=p[1]?'✔ ':'○ ')+p[0]+' (score '+p[1]+'+)</span></div>').join("")+'<p class="mute">A milestone unlocks when the score stays above it for 28 days. Real earnings need ads or sponsors, added later.</p></div>'},
set:()=>{const sw=(k,l)=>'<div class="sw"><span>'+l+'</span><input type="checkbox" data-k="'+k+'" '+(S.set[k]?'checked':'')+' style="width:22px;height:22px"></div>';return '<h2>Settings</h2><div class="card pad"><div class="sw"><span>Theme</span><span>'+["auto","light","dark"].map(t=>'<button class="btn '+(S.set.theme==t?'p':'')+'" data-th="'+t+'">'+{auto:"Auto",light:"Light",dark:"Dark"}[t]+'</button> ').join("")+'</span></div><div class="sw"><span>Text size</span><span><button class="btn" data-f="-.1">A-</button> <button class="btn" data-f=".1">A+</button></span></div>'+sw("n1","New video notifications")+sw("n2","Comment notifications")+'<div class="sw"><span>Language</span><span class="mute">English</span></div></div>'},
acct:()=>S.user?'<h2>Account</h2><div class="card pad"><b>'+esc(S.user.displayName||"No name")+'</b><div class="mute">'+esc(S.user.email)+'</div><div class="row" style="margin-top:10px"><button class="btn p" id="out">Log out</button></div></div>':'<h2>Account</h2><div class="card pad"><label>Name (for sign up)</label><input type="text" id="nm"><label>Email</label><input type="email" id="em"><label>Password (6+ characters)</label><input type="password" id="pw"><div class="row" style="margin-top:12px"><button class="btn p" id="su">Create account</button><button class="btn" id="li">Log in</button></div><p class="bad">'+esc(S.msg)+'</p></div>'
};
function chk(){const t=$("ti").value,tg=$("tg").value.split(",").filter(s=>s.trim()),o=[];o.push([t.length>=10,"Title is at least 10 characters"]);o.push([!/(.)\1{3,}/.test(t)&&!/[!?]{3,}/.test(t),"No repeated letters or !!! spam"]);o.push([t==""||t!=t.toUpperCase()||/[^A-Za-z]/.test(t),"Title is not all capital letters"]);o.push([tg.length<=15,"No more than 15 tags ("+tg.length+")"]);$("tc").textContent=t.length+"/70";$("ck").innerHTML="<b>Spam check</b>"+o.map(a=>'<div class="'+(a[0]?'ok':'bad')+'">'+(a[0]?'✔ ':'✖ ')+a[1]+'</div>').join("");return o.every(a=>a[0])}
function show(){
$("m").innerHTML=S.busy?'<p class="mute">Loading…</p>':V[S.tab]();
$("n").innerHTML=T.map(a=>'<button class="'+(a[0]==S.tab?'on':'')+'" data-t="'+a[0]+'"><span>'+a[1]+'</span>'+a[2]+'</button>').join("");
if(S.tab=="studio"&&S.user&&!S.busy){chk();$("ti").oninput=chk;$("tg").oninput=chk}
history.replaceState(null,"","#"+S.tab);
}
const errs={"auth/email-already-in-use":"This email already has an account. Use Log in.","auth/invalid-credential":"Wrong email or password.","auth/weak-password":"Password needs 6+ characters.","auth/invalid-email":"That email does not look right.","auth/missing-password":"Enter a password."};
async function authDo(kind){
const em=$("em").value.trim(),pw=$("pw").value,nm=$("nm").value.trim();
try{
if(kind=="su"){const c=await createUserWithEmailAndPassword(auth,em,pw);await updateProfile(c.user,{displayName:nm||em.split("@")[0]});await setDoc(doc(db,"users",c.user.uid),{name:nm||em.split("@")[0],createdAt:serverTimestamp()})}
else await signInWithEmailAndPassword(auth,em,pw);
S.msg="";
}catch(e){S.msg=errs[e.code]||e.code||e.message;show()}
}
document.addEventListener("click",async e=>{
const b=e.target.closest("button");if(!b)return;const d=b.dataset;
if(d.t){S.tab=d.t;S.msg="";return show()}
if(d.w!==undefined){if(!S.user){S.tab="acct";S.msg="Log in to Wow videos.";return show()}
const id=S.user.uid+"_"+d.w,had=S.mine.has(d.w);
try{if(had){await deleteDoc(doc(db,"wows",id));S.mine.delete(d.w);S.wc[d.w]=Math.max(0,(S.wc[d.w]||1)-1)}else{await setDoc(doc(db,"wows",id),{uid:S.user.uid,videoId:d.w});S.mine.add(d.w);S.wc[d.w]=(S.wc[d.w]||0)+1}}catch(x){alert("Error: "+x.message)}
return show()}
if(d.j!==undefined){if(!S.user){S.tab="acct";S.msg="Log in to join a Circle.";return show()}
const id=S.user.uid+"_"+d.j;
try{if(S.circ[d.j]){await deleteDoc(doc(db,"circles",id));delete S.circ[d.j]}else{const o=S.videos.find(v=>v.ownerId==d.j);const c={uid:S.user.uid,ownerId:d.j,ownerName:o?o.ownerName:"",days:0,lastDay:""};await setDoc(doc(db,"circles",id),c);S.circ[d.j]=c}}catch(x){alert("Error: "+x.message)}
return show()}
if(d.s!==undefined){const c=S.circ[d.s];if(c&&c.lastDay!=today()){c.days++;c.lastDay=today();try{await setDoc(doc(db,"circles",S.user.uid+"_"+d.s),c)}catch(x){alert("Error: "+x.message)}}return show()}
if(d.g!==undefined){S.gi=+d.g;return}
if(d.th){S.set.theme=d.th;theme();saveSet();return show()}
if(d.f){S.set.fs=Math.min(1.4,Math.max(.8,S.set.fs+ +d.f));theme();saveSet();return show()}
if(b.id=="nx"){S.sh++;return show()}
if(b.id=="su")return authDo("su");
if(b.id=="li")return authDo("li");
if(b.id=="out"){await signOut(auth);S.tab="home";return}
if(b.id=="pub"){if(!chk())return alert("Fix the red items in the spam check first");
const t=$("ti").value.trim(),tg=$("tg").value.split(",").map(s=>s.trim()).filter(Boolean);
try{await addDoc(collection(db,"videos"),{t:t,tb:$("tb").value.trim(),ds:$("ds").value,tags:tg,g:S.gi,ownerId:S.user.uid,ownerName:S.user.displayName||"Creator",createdAt:serverTimestamp()});S.tab="home";await load()}catch(x){S.msg="Could not publish: "+x.message;show()}}
});
document.addEventListener("change",e=>{const k=e.target.dataset.k;if(k){S.set[k]=e.target.checked;saveSet()}});
document.addEventListener("input",e=>{const k=e.target.dataset.m;if(k){S.m[k]=+e.target.value;const y=scrollY;show();scrollTo(0,y)}});
theme();
const h=location.hash.slice(1);if(V[h])S.tab=h;
onAuthStateChanged(auth,u=>{S.user=u;load()});
</script>
</body>
</html>
